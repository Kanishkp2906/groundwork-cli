version: 2
project_name: groundwork

before:
  hooks:
    - cd go_client && go mod tidy
    - cd go_client && go generate ./...

builds:
  - id: groundwork
    main: ./go_client/main.go
    dir: ./go_client
    binary: groundwork
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  github:
    owner: Kanishkp2906
    name: groundwork-cli
  draft: false
  prerelease: auto

# Note: Homebrew, Scoop, Chocolatey, Docker configs moved to separate files
# or removed for v2. Use goreleaser's new config format if needed.